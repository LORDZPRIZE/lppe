name: Deploy LPPE Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - wrangler.toml
      - '.github/workflows/deploy-lppe-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lppe-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run release regression suite
        run: node --test scripts/*.test.mjs scripts/test-*.mjs worker/*.test.mjs
      - name: Check whether Cloudflare already published the production revision
        id: native
        if: github.event_name == 'push'
        run: |
          version() { sed -n 's/.*status:"online",version:"\([0-9.]*\)".*/\1/p'; }
          before=$(git show HEAD^:worker/lppe-api.js | version)
          current=$(version < worker/lppe-api.js)
          if [ "$current" != "$before" ] && EXPECTED_VERSION="$current" node scripts/check-worker-deployment.mjs; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy lppe-api
        if: steps.native.outputs.ready != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.169.0'
          command: deploy --tag ${{ github.sha }}
      - name: Verify production Worker revision
        if: steps.native.outputs.ready != 'true'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/check-worker-deployment.mjs
