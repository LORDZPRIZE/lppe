name: LPPE optimizer checks

on:
  push:
    branches: [main, lppe-autonomous-dfs, lppe-product-roadmap, lppe-production-validation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optimizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          git ls-files -z '*.js' '*.mjs' | xargs -0 -n 1 node --check
      - name: Run FanDuel, PrizePicks and DFS regression tests
        run: node --test scripts/*.test.mjs scripts/test-*.mjs worker/*.test.mjs
      - name: Check Python historical audit syntax
        run: python3 -c "import ast,pathlib; ast.parse(pathlib.Path('scripts/fanduel_contest_review.py').read_text())"
      - name: Verify preview uses isolated KV
        run: |
          python3 - <<'PYTHON'
          import tomllib

          with open("wrangler.toml", "rb") as handle:
              config = tomllib.load(handle)
          production = {entry["id"] for entry in config["kv_namespaces"]}
          preview = {entry["binding"]: entry["id"] for entry in config["previews"]["kv_namespaces"]}
          assert "PRIZEPICKS_BOARD" in preview, "Missing preview board KV binding"
          assert production.isdisjoint(preview.values()), "Preview KV must be separate from production"
          PYTHON
      - name: Bundle Cloudflare Worker from repository root
        run: npx --yes wrangler@4.169.0 deploy --dry-run --outdir "${RUNNER_TEMP}/lppe-worker"
