name = "lppe-api"
main = "worker/lppe-api.js"
compatibility_date = "2026-11-12"
keep_vars = true
workers_dev = true

[vars]
PRIZEPICKS_PREGAME_REFRESH = "1"

[observability.logs]
enabled = true
invocation_logs = true

[[kv_namespaces]]
binding = "PRIZEPICKS_BOARD"
id = "bb9802fc725c488cb7f43ef56002f689"

[triggers]
crons = ["*/15 * * * *"]

[version_metadata]
binding = "LPPE_VERSION"
